<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>星塵夢汐 Stardust DreamTide</title>
<meta name="description" content="星塵夢汐 — 夢境日記 × 月相許願 × CBT 自我紀錄 × 水晶圖鑑 × 時空膠囊（個人紀錄用途）">
<meta name="theme-color" content="#0d0d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="星塵夢汐">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1>星塵<span>夢汐</span> <small style="font-size:.65em;color:var(--ink-3)">Stardust DreamTide</small></h1>
  <div class="today-moon" id="header-moon"></div>
</header>

<main>
  <section id="view-today" class="view active"></section>
  <section id="view-dream" class="view"></section>
  <section id="view-cbt" class="view"></section>
  <section id="view-moon" class="view"></section>
  <section id="view-crystal" class="view"></section>
  <section id="view-cosmos" class="view"></section>
  <section id="view-summon" class="view"></section>
  <section id="view-more" class="view"></section>
  <section id="view-settings" class="view"></section>
  <footer class="app-footer">
    <span>Blue Chiou Copyright ©</span>
    <a class="ig-link" href="https://instagram.com/blueicn" target="_blank" rel="noopener noreferrer" aria-label="Blue 的 Instagram（在新分頁開啟）">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
        <circle cx="12" cy="12" r="4.2"/>
        <circle cx="17.6" cy="6.4" r="1.1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </footer>
</main>

<div id="book-landing" class="book-landing hidden" aria-hidden="true"></div>

<!-- 分頁列：可左右滑動，預設顯示六個 -->
<nav class="tabbar">
  <div class="tabbar-scroll" id="tabbar-scroll">
    <button data-tab="today" class="on"><span class="ico">🏠</span>首頁</button>
    <button data-tab="dream"><span class="ico">🌙</span>夢境</button>
    <button data-tab="cbt"><span class="ico">🧠</span>思考</button>
    <button data-tab="moon"><span class="ico">📅</span>月曆</button>
    <button data-tab="crystal"><span class="ico">💎</span>水晶</button>
    <button data-tab="cosmos"><span class="ico">🌌</span>宇宙</button>
    <button data-tab="summon"><span class="ico">🔮</span>召喚</button>
    <button data-tab="more"><span class="ico">🗝</span>寶庫</button>
    <button data-tab="settings"><span class="ico">⚙️</span>設定</button>
  </div>
</nav>

<div id="modal-root"></div>

<script>
  // 從 serverless config 讀 Google Client ID（非機密，可入前端；未設定則雲端功能自動隱藏）
  fetch("api/config", { cache: "no-store" })
    .then(r => r.ok ? r.json() : {})
    .then(c => {
      if (c.googleClientId) {
        window.STARDUST_GOOGLE_CLIENT_ID = c.googleClientId;
        // GIS 可能已經比 fetch 先跑完；補呼叫一次讓 Drive 按鈕出現
        if (typeof initCloud === "function") initCloud();
        if (typeof refreshCloudUI === "function") refreshCloudUI();
      }
    })
    .catch(() => {});
</script>
<script src="app.js"></script>
<script src="crystals.js"></script>
<script src="cloud.js"></script>
<script src="account.js"></script>
<script async defer src="https://accounts.google.com/gsi/client"></script>
</body>
</html>
